name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            system: Linux
            arch: x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            system: Darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check native runner and install toolchain
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          test "$(uname -s)" = "$EXPECTED_SYSTEM"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          rustup toolchain install --no-self-update --target "$TARGET"
          python3 --version
          uname -a
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
          cache-bin: false
      - name: Validate version and contract
        id: contract
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag=$(python3 scripts/release.py tag "$REF_NAME")
          else
            tag=$(python3 scripts/release.py tag)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s scripts -p "test_*.py"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Build and fixture-test executable
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ steps.contract.outputs.tag }}
        run: |
          cargo build --release --locked --target "$TARGET"
          python3 scripts/release.py check "target/$TARGET/release/grepglint" "$TARGET"
          python3 scripts/release_smoke.py "target/$TARGET/release/grepglint" "$TAG"
          mkdir -p dist
          cp "target/$TARGET/release/grepglint" "dist/grepglint-$TAG-$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  checksums:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Assemble and verify complete manifest
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag=$(python3 scripts/release.py tag "$REF_NAME")
          else
            tag=$(python3 scripts/release.py tag)
          fi
          python3 scripts/release.py manifest dist "$tag"
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'alundgren/grepglint'
    needs: checksums
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/grepglint-*
      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          printf 'Source commit: `%s`\n\nSee docs/releases.md at this tag for verification instructions.\n' "$COMMIT" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo alundgren/grepglint --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" grepglint-* SHA256SUMS
